<script id="app-data" type="application/json">{"pages": [{"id": "home", "title": "HOME", "text": "state-less\n\nWalter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.\n\nHannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.\n\nGershom Scholem warned that secular Hebrew carried what he called an \"apocalyptic sting\" — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.\n\nYeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.\n\nThis site rereads. It checks the receipts.\n\nItay Eisinger · lecturer in Hebrew · Davis, California", "kind": "Entrance"}, {"id": "how-we-got-here", "title": "HOW WE GOT HERE AND WHERE WE ARE?", "text": "This is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. \"How we got here\" assumes arrival. \"Where we are\" concedes that we do not know.\n\nThe texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.\n\nThe question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra's curse was not that she was wrong.\n\nThis page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.", "kind": "Essay"}, {"id": "ein-medina", "title": "EIN MEDINA", "text": "אין מדינה. There is no state. In Israeli slang: nothing works, nobody's in charge, the bus isn't coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.\n\nThe phrase holds three ideas at once and this page holds all three.\n\nThe anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau's 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.\n\nThe failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.\n\nThe slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.\n\nA state can be sovereign and still be ein medina to the people it governs without representing.", "kind": "Essay"}, {"id": "reading", "title": "READING", "text": "This is where texts get reread.\n\nEach entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.\n\nJacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha'am), Violence (trauma as identity, shame as engine). Rose's best sentence: \"When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.\" Her weakest move: finding messianism \"even when it does not know it is there\" — a claim no evidence can disconfirm.\n\nShaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.\n\nDavid Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.\n\nAmos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein's introduction contains at least two internal contradictions, which is itself an instance of what the book describes.", "kind": "Reading"}, {"id": "historians", "title": "HISTORIANS ON HISTORIANS", "text": "What happens when the child of a historian reads historians?\n\nThe historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact's clothing.\n\nTom Segev and David Ohana write of the \"security state\" through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution's brief. Both claim the archive. The archive does not arbitrate.\n\nThis page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.", "kind": "Essay"}, {"id": "linkd", "title": "LINKD", "text": "What this site is reading, using, and responding to. Updated when something earns its place here.", "kind": "Links"}, {"id": "nation-undoing", "title": "NATION UNDOING", "text": "The un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.\n\nOne reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.\n\nAnother reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism's founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.\n\nA third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid's counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn't exist. This is the hardest position on the site, because it refuses both defense and demolition.", "kind": "Essay"}, {"id": "infantilization", "title": "INFANTILIZATION", "text": "The security establishment has a favorite grammatical move: conjugate the citizen as a child. \"Trust me\" and \"believe in me\" share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.\n\nThe emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.\n\nInfantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. \"A servant when he becomes king\" — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.", "kind": "Essay"}, {"id": "son-of-a-historian", "title": "ZIONISM AND HISTORY, SON OF A HISTORIAN, LION", "text": "The title is a note to self and it stays as one. The page is about what it's like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.\n\nThere is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation's answer was good enough. It never is, which is why the question keeps being asked.\n\nLion: Aryeh. A name. A father's name, or a metaphor, or both. The page doesn't owe the visitor an explanation. The title is honest about being unfinished.", "kind": "Essay"}, {"id": "golem", "title": "ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE", "text": "The Golem of Prague was built to protect the Jews. It worked until it didn't. The creature grew beyond its maker's control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.\n\nIan Lustick argues that the discourse of antisemitism has become Israel's golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; the invocation produces the very conflation of Jews and Israel that generates antisemitism; the new antisemitism is then cited as proof that the invocation was necessary. The loop is self-sealing. The golem cannot be turned off because turning it off would require admitting that the danger it was built to fight is partly the danger it creates.\n\nThis is not a claim that antisemitism is not real. It is a claim about what happens when a real phenomenon is put to work until the instrument becomes indistinguishable from the phenomenon. Katz's taxonomy — critical vs. negationist anti-Zionism — is a golem in this sense: a sorting machine designed to protect, whose classifications generate the discretion they were supposed to eliminate.\n\nThe golem is the mythic register of the same argument that runs through this site in its political and scholarly registers. The state was built to protect. It protects. It also produces the conditions that require its protection. The circuit does not break from inside.", "kind": "Essay"}, {"id": "too-late", "title": "THE TOO LATE-ZIONISM", "text": "Belatedness is trauma's own time signature. The event is known only afterward. The warning is readable only after the thing it warned against has happened. Cassandra is canonized retrospectively — given credit for seeing what nobody wanted to see, at the exact moment when seeing it no longer helps.\n\n\"Too late\" is the temporal form of the site's entire argument.\n\nAhad Ha'am was right in 1891, and it changed nothing. Kohn was right in 1929, and it changed nothing. By the time Leibowitz was right, in 1968, rightness itself had started to look like a symptom — the dissenter's record growing longer and more accurate and less consequential with each decade. The dystopian novelists of the 1980s and 2000s imagined civil war, theocracy, the security state consuming itself. Their novels were reviewed and shelved.\n\n\"Too late\" is also the tense of October 2023. The event after which the warnings could no longer be dismissed — and after which hearing them could no longer prevent what they warned against. The Declassified Page, the companion artifact to the book, ends with the sentence \"What began as a warning from the margins ends as testimony.\" That is the definition of too late: the moment when prophecy becomes record.\n\nThere is a Zionism that knows it is too late — that the project cannot deliver what it promised, that the costs have exceeded what the founders imagined, that the state has reproduced the conditions it was built to end — and continues anyway, because the alternative (abandonment, collapse, starting over) is also too late. This is the position nobody wants to occupy: the too-late Zionist, who cannot defend the project and cannot leave it. Much of what is written on this site is written from that position, or near it.", "kind": "Essay"}, {"id": "close-enough", "title": "NEW PAGE: CLOSE ENOUGH TO BE WRONG", "text": "Things that went wrong when a sentence crossed a border.\n\n\"79% of Israeli Jews don't care about dead children in Gaza.\" That is what Shaul Magid told Haaretz in August 2025. The Israel Democracy Institute's July 2025 survey actually asked whether respondents were personally troubled by reports of hunger and suffering among the Palestinian population in Gaza. Not \"care.\" Not \"children.\" Not \"dead.\" The 79% is a collapsed two-point band (almost not troubled + not at all troubled) whose internal breakdown the IDI did not publish on its summary page. Three distortions in one citation, each small enough to miss, each changing what the number means. The survey is real. The finding is real. What Magid said about it is not what it said about itself.\n\nFour models read a poem. In 2012 I published a Hebrew poem in Haaretz. It is set at Ben-Gurion Airport — the statesman, not the destination. A drunk Russian literary ghost (Venedikt Yerofeyev, author of Moscow-Petushki) delivers a monologue at the departure gate. Four AI models were asked to translate it. Each one missed the Yerofeyev intertext. Each produced a different wrong poem. The errors were not random — each model resolved the ambiguity by choosing the most conventional reading available, which in every case meant flattening the joke. The poem survived translation only after the misreadings were identified and removed.\n\nTen translations of one letter. In February 2025, Rav Dov Landau published a letter declaring Zionism to be כפירה ומרידה במלכות שמים — heresy and rebellion against the Kingdom of Heaven. Ten English-language outlets translated the letter. Ten different renderings of שמד: apostasy, forced conversion, spiritual destruction, cultural erasure. Each translation is a theological argument pretending to be a word choice. None is wrong. None is the same as any other.\n\n52 errors in seven articles. A corpus of Ynet news articles, audited for Hebrew-language errors: agreement violations, proscribed connectors, English calques, construct-chain problems. Opinion and long-form analysis carried the most errors. Short quote-driven news carried the fewest. The pattern is consistent enough to be structural: the further a text travels from its source, the more it degrades.\n\nThis page collects exhibits. The thesis is one sentence: meaning degrades when it crosses a border. The border can be a language, a survey methodology, a neural network, a newsroom style guide, or a theological tradition. The degradation is the evidence.", "kind": "Exhibit"}, {"id": "iran", "title": "NEW PAGE: IRAN, ×22", "text": "Patrick Cockburn, The Jihadis Return: ISIS and the New Sunni Uprising (2014). A book about ISIS. Word search: \"Iran\" appears twenty-two times. \"Israel\" appears once.\n\nThe count is the argument. A book about the Islamic State in Iraq and Syria mentions Iran on nearly every other page and Israel on one page. This is not a gap in Cockburn's knowledge. It is an accurate reflection of the regional dynamics that produced ISIS, in which Iranian influence, Saudi funding, and the collapse of the Iraqi state were the operative forces and Israel was peripheral. The count registers what the book's own analysis knows but its Western readers may not expect: that the Middle East has a structure, and Israel is not always at its center.\n\nThis is the first entry in a series. Each one takes a text, counts a word, and lets the number do the arguing.\n\nSelf-determination, ×19. Shaul Magid, The Necessity of Exile. Nineteen occurrences in the body text. Fourteen in Chapter One alone. The word enters the book as a right, shifts to a claim, migrates to an assumption, and by its final appearance functions as the thing being contested. The semantic drift is visible only in the count.\n\nAntisemitism, ×37 / Palestinian, ×36. Ethan Katz, \"When Is Anti-Zionism Antisemitic?\" Two words in near-lockstep across 6,272 body words. One names the threat. The other names the people whose political claims are being sorted by the threat. The ratio is the essay's unconscious admission that it cannot discuss one without summoning the other.", "kind": "Concordance"}, {"id": "exercise", "title": "NEW PAGE: EXERCISE 8 — TRANSLATE טשטוש", "text": "A vocabulary quiz you cannot pass.\n\nIn his poem \"Exercises in Practical Hebrew,\" Dan Pagis wrote a language-textbook exercise that turns into the Holocaust mid-lesson. The form of the exercise is the joke and the horror at once: the orderly pedagogical structure cannot contain what it is being asked to teach.\n\nThis page borrows the form. Below is a real exercise. It uses a real word from a real political speech. There is no correct answer.\n\nTranslate: טשטוש (tishṭush).\n\nThe word appears in Israeli security and political discourse to describe the blurring of boundaries — between civilian and military authority, between institutional roles, between truth and its management. It derives from the root ט.ש.ט.ש, which in construction Hebrew means to plaster or skim-coat a wall.\n\nChoose the best English rendering:\n\n(a) Blurring — accurate to the visual metaphor; loses the physical register entirely. (b) Whitewashing — captures the cover-up connotation; imports a racial metaphor absent from the Hebrew. (c) Papering over — preserves the construction-trade register; loses the spatial and visual sense. (d) Obfuscation — semantically precise; sounds like a legal filing, not a political speech.\n\nEach answer is defensible. Each loses something the Hebrew carries without effort. The exercise teaches what translation always teaches: that no rendering is wrong, and none is the same as the original, and the gap between them is where the meaning lives.\n\nMore exercises, built from the same method: מרות (authority / subordination / the texture of being ruled), מזב\"ש (a military acronym for damage control that has become a civilian verb), שליח ציבור (the prayer leader who is also, literally, a public emissary — which is the religious sense and which is the political one?).", "kind": "Exercise"}], "notes": [{"page": "home", "label": "Quotation status", "observation": "The v2 text says “what he called” and puts “apocalyptic sting” in quotation marks. The preceding assistant incorrectly called this a paraphrase.", "question": "Uncertain: which source, translation, and location support this wording?"}, {"page": "home", "label": "Institutional description", "observation": "The byline is preserved from v2. The app does not independently establish the author’s current title.", "question": "Uncertain: confirm the byline before public release."}, {"page": "ein-medina", "label": "Distinct arguments", "observation": "Everyday dysfunction, a critique of sovereignty, and rightlessness are brought together by this page. Their juxtaposition is an interpretation, not proof that they are equivalent.", "question": "Uncertain: confirm whether the last line should name its governed population rather than leave the referent implicit."}, {"page": "ein-medina", "label": "Hedge and assertion", "observation": "“That it counts as repetition is not” remains categorical. Calling failure contestable does not, by itself, establish the repetition claim.", "question": "Uncertain: which instances carry the repetition argument? Keep the examples alongside the claim."}, {"page": "reading", "label": "Reading ledger", "observation": "The supplied entries include direct quotations, review judgments, and claims about particular chapters. They are preserved as draft entries, not validated bibliographical records.", "question": "Uncertain: add author-approved source locations and review links."}, {"page": "historians", "label": "Rhetoric versus demonstration", "observation": "The Morris replacement and the Shapira/Pappé pairing remain interpretive compressions. Repeated model approval does not make these source statements.", "question": "Uncertain: confirm which formulations you endorse and attach the relevant passages."}, {"page": "nation-undoing", "label": "Shared thesis", "observation": "“Each of whom warned” attributes a shared position to unnamed security chiefs. The passage provides neither speakers nor speeches.", "question": "Uncertain: identify the approved examples, or keep this as a research question."}, {"page": "infantilization", "label": "Quote dependency remains", "observation": "The locomotive quotation is absent, but the Proverbs quotation and its claimed institutional use remain. The earlier audit therefore overstated that the page was fully de-risked.", "question": "Uncertain: supply the speech location for the establishment’s use of the verse."}, {"page": "infantilization", "label": "Root versus political use", "observation": "The argument moves from a shared root to obedience, and from older to newer objects of loyalty. Those steps require usage evidence beyond the shared root itself.", "question": "Uncertain: select dated passages showing who asks for loyalty and to whom."}, {"page": "son-of-a-historian", "label": "Autobiographical provenance", "observation": "Earlier model replies speculated about a father, a name, books on a shelf, and dinner-table conversations. The pasted v2 contains those details but does not independently confirm their origin.", "question": "Uncertain: confirm which details are yours. Do not publish assistant inference as autobiography."}, {"page": "golem", "label": "Attribution boundary", "observation": "The page shifts from an attribution to Lustick into an application to Katz. The second move should remain distinguishable from the first.", "question": "Uncertain: supply the Lustick passage and confirm the Katz application as your own argument."}, {"page": "too-late", "label": "Influence versus prevention", "observation": "“It changed nothing” is stronger than “it did not prevent what followed.” The escalating cadence does not establish absence of influence.", "question": "Uncertain: decide whether the claim concerns reception, political effect, or prevention."}, {"page": "too-late", "label": "Authorial position", "observation": "The final paragraph attributes a political position to the writer. It is not made settled by an assistant ranking it highly.", "question": "Uncertain: confirm whether “cannot defend the project and cannot leave it” describes your position."}, {"page": "close-enough", "label": "Internal wording conflict", "observation": "The poem exhibit says “Ben-Gurion Airport” and then “the statesman, not the destination.” The earlier chat argued for distinguishing the airport from the statesman.", "question": "Uncertain: restore the intended wording from your poem or translation notes."}, {"page": "close-enough", "label": "Evidence scope", "observation": "The survey, translation, AI-reading, and newsroom counts appear here as supplied claims. This build has not retrieved their underlying records.", "question": "Uncertain: provide the survey item, poem audit, translation ledger, and article audit before marking the exhibits verified."}, {"page": "close-enough", "label": "Change is not always degradation", "observation": "“None is wrong” and “meaning degrades” pull in different directions. Translation differences need not be errors; errors need not establish a universal account of translation.", "question": "Uncertain: decide which entries document error and which document defensible difference."}, {"page": "iran", "label": "Count versus distribution", "observation": "An occurrence total does not establish how many pages contain the term, or whether it appears on nearly every other page.", "question": "Uncertain: retain the supplied counts, but attach edition, search rules, and page distribution before making the page-frequency claim."}, {"page": "iran", "label": "Count versus meaning", "observation": "The total of a word does not by itself demonstrate semantic drift or an unconscious admission. Those interpretations need the passages and their sequence.", "question": "Uncertain: add concordance rows so the reader can assess the interpretation."}, {"page": "exercise", "label": "Lexical and source record", "observation": "The exercise names a real political speech but does not identify it. Its construction-register and etymological claims are preserved as supplied, not independently verified.", "question": "Uncertain: add the speech passage and your lexical source."}, {"page": "exercise", "label": "No score is not no error", "observation": "An exercise with several defensible options does not establish that no translation can be wrong. Interactive feedback in this app has no correctness score.", "question": "Uncertain: confirm the contextual limits of the four alternatives."}, {"page": "audit", "label": "Missing promised exhibit", "observation": "The v2 preface promises an unverifiable-quote exhibit; the supplied pages do not contain it. No replacement quotation or exhibit has been invented in this build.", "question": "Uncertain: do you want that exhibit? Failure to retrieve a transcript alone does not establish fabrication."}, {"page": "audit", "label": "Draft is not locked", "observation": "Earlier replies called their own text canonical or locked pending approval and described files as written without delivering an attachment. Those are not author approvals or evidence of completed file delivery.", "question": "Uncertain: choose what to approve after reviewing this actual artifact."}, {"page": "audit", "label": "Model-review coverage", "observation": "The chat contains named-model reports and council summaries. This build preserves their status as reports; it has not independently run three models.", "question": "Uncertain: assess recommendations by their supporting passages, not model agreement alone."}], "source": "state-less — page content (v2)\nIncorporates: three sourcing fixes (Zini, Morris, Scholem verification note), the overclaim fix on Ein Medina, the escalating cadence on Too Late, the Ein Medina closer, the Infantilization rewrite, plus three new pages (the unverifiable-quote exhibit, the counting method, and the first Exercises in Practical Hebrew post).\n\n## HOME\n\nstate-less\n\nWalter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.\n\nHannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.\n\nGershom Scholem warned that secular Hebrew carried what he called an \"apocalyptic sting\" — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.\n\nYeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.\n\nThis site rereads. It checks the receipts.\n\nItay Eisinger · lecturer in Hebrew · Davis, California\n\n## HOW WE GOT HERE AND WHERE WE ARE?\n\nThis is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. \"How we got here\" assumes arrival. \"Where we are\" concedes that we do not know.\n\nThe texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.\n\nThe question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra's curse was not that she was wrong.\n\nThis page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.\n\n## EIN MEDINA\n\nאין מדינה. There is no state. In Israeli slang: nothing works, nobody's in charge, the bus isn't coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.\n\nThe phrase holds three ideas at once and this page holds all three.\n\nThe anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau's 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.\n\nThe failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.\n\nThe slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.\n\nA state can be sovereign and still be ein medina to the people it governs without representing.\n\n## READING\n\nThis is where texts get reread.\n\nEach entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.\n\nJacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha'am), Violence (trauma as identity, shame as engine). Rose's best sentence: \"When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.\" Her weakest move: finding messianism \"even when it does not know it is there\" — a claim no evidence can disconfirm.\n\nShaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.\n\nDavid Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.\n\nAmos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein's introduction contains at least two internal contradictions, which is itself an instance of what the book describes.\n\n## HISTORIANS ON HISTORIANS\n\nWhat happens when the child of a historian reads historians?\n\nThe historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact's clothing.\n\nTom Segev and David Ohana write of the \"security state\" through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution's brief. Both claim the archive. The archive does not arbitrate.\n\nThis page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.\n\n## LINKD\n\nWhat this site is reading, using, and responding to. Updated when something earns its place here.\n\n## NATION UNDOING\n\nThe un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.\n\nOne reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.\n\nAnother reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism's founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.\n\nA third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid's counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn't exist. This is the hardest position on the site, because it refuses both defense and demolition.\n\n## INFANTILIZATION\n\nThe security establishment has a favorite grammatical move: conjugate the citizen as a child. \"Trust me\" and \"believe in me\" share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.\n\nThe emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.\n\nInfantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. \"A servant when he becomes king\" — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.\n\n## ZIONISM AND HISTORY, SON OF A HISTORIAN, LION\n\nThe title is a note to self and it stays as one. The page is about what it's like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.\n\nThere is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation's answer was good enough. It never is, which is why the question keeps being asked.\n\nLion: Aryeh. A name. A father's name, or a metaphor, or both. The page doesn't owe the visitor an explanation. The title is honest about being unfinished.\n\n## ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE\n\nThe Golem of Prague was built to protect the Jews. It worked until it didn't. The creature grew beyond its maker's control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.\n\nIan Lustick argues that the discourse of antisemitism has become Israel's golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; the invocation produces the very conflation of Jews and Israel that generates antisemitism; the new antisemitism is then cited as proof that the invocation was necessary. The loop is self-sealing. The golem cannot be turned off because turning it off would require admitting that the danger it was built to fight is partly the danger it creates.\n\nThis is not a claim that antisemitism is not real. It is a claim about what happens when a real phenomenon is put to work until the instrument becomes indistinguishable from the phenomenon. Katz's taxonomy — critical vs. negationist anti-Zionism — is a golem in this sense: a sorting machine designed to protect, whose classifications generate the discretion they were supposed to eliminate.\n\nThe golem is the mythic register of the same argument that runs through this site in its political and scholarly registers. The state was built to protect. It protects. It also produces the conditions that require its protection. The circuit does not break from inside.\n\n## THE TOO LATE-ZIONISM\n\nBelatedness is trauma's own time signature. The event is known only afterward. The warning is readable only after the thing it warned against has happened. Cassandra is canonized retrospectively — given credit for seeing what nobody wanted to see, at the exact moment when seeing it no longer helps.\n\n\"Too late\" is the temporal form of the site's entire argument.\n\nAhad Ha'am was right in 1891, and it changed nothing. Kohn was right in 1929, and it changed nothing. By the time Leibowitz was right, in 1968, rightness itself had started to look like a symptom — the dissenter's record growing longer and more accurate and less consequential with each decade. The dystopian novelists of the 1980s and 2000s imagined civil war, theocracy, the security state consuming itself. Their novels were reviewed and shelved.\n\n\"Too late\" is also the tense of October 2023. The event after which the warnings could no longer be dismissed — and after which hearing them could no longer prevent what they warned against. The Declassified Page, the companion artifact to the book, ends with the sentence \"What began as a warning from the margins ends as testimony.\" That is the definition of too late: the moment when prophecy becomes record.\n\nThere is a Zionism that knows it is too late — that the project cannot deliver what it promised, that the costs have exceeded what the founders imagined, that the state has reproduced the conditions it was built to end — and continues anyway, because the alternative (abandonment, collapse, starting over) is also too late. This is the position nobody wants to occupy: the too-late Zionist, who cannot defend the project and cannot leave it. Much of what is written on this site is written from that position, or near it.\n\n## NEW PAGE: CLOSE ENOUGH TO BE WRONG\n\nThings that went wrong when a sentence crossed a border.\n\n\"79% of Israeli Jews don't care about dead children in Gaza.\" That is what Shaul Magid told Haaretz in August 2025. The Israel Democracy Institute's July 2025 survey actually asked whether respondents were personally troubled by reports of hunger and suffering among the Palestinian population in Gaza. Not \"care.\" Not \"children.\" Not \"dead.\" The 79% is a collapsed two-point band (almost not troubled + not at all troubled) whose internal breakdown the IDI did not publish on its summary page. Three distortions in one citation, each small enough to miss, each changing what the number means. The survey is real. The finding is real. What Magid said about it is not what it said about itself.\n\nFour models read a poem. In 2012 I published a Hebrew poem in Haaretz. It is set at Ben-Gurion Airport — the statesman, not the destination. A drunk Russian literary ghost (Venedikt Yerofeyev, author of Moscow-Petushki) delivers a monologue at the departure gate. Four AI models were asked to translate it. Each one missed the Yerofeyev intertext. Each produced a different wrong poem. The errors were not random — each model resolved the ambiguity by choosing the most conventional reading available, which in every case meant flattening the joke. The poem survived translation only after the misreadings were identified and removed.\n\nTen translations of one letter. In February 2025, Rav Dov Landau published a letter declaring Zionism to be כפירה ומרידה במלכות שמים — heresy and rebellion against the Kingdom of Heaven. Ten English-language outlets translated the letter. Ten different renderings of שמד: apostasy, forced conversion, spiritual destruction, cultural erasure. Each translation is a theological argument pretending to be a word choice. None is wrong. None is the same as any other.\n\n52 errors in seven articles. A corpus of Ynet news articles, audited for Hebrew-language errors: agreement violations, proscribed connectors, English calques, construct-chain problems. Opinion and long-form analysis carried the most errors. Short quote-driven news carried the fewest. The pattern is consistent enough to be structural: the further a text travels from its source, the more it degrades.\n\nThis page collects exhibits. The thesis is one sentence: meaning degrades when it crosses a border. The border can be a language, a survey methodology, a neural network, a newsroom style guide, or a theological tradition. The degradation is the evidence.\n\n## NEW PAGE: IRAN, ×22\n\nPatrick Cockburn, The Jihadis Return: ISIS and the New Sunni Uprising (2014). A book about ISIS. Word search: \"Iran\" appears twenty-two times. \"Israel\" appears once.\n\nThe count is the argument. A book about the Islamic State in Iraq and Syria mentions Iran on nearly every other page and Israel on one page. This is not a gap in Cockburn's knowledge. It is an accurate reflection of the regional dynamics that produced ISIS, in which Iranian influence, Saudi funding, and the collapse of the Iraqi state were the operative forces and Israel was peripheral. The count registers what the book's own analysis knows but its Western readers may not expect: that the Middle East has a structure, and Israel is not always at its center.\n\nThis is the first entry in a series. Each one takes a text, counts a word, and lets the number do the arguing.\n\nSelf-determination, ×19. Shaul Magid, The Necessity of Exile. Nineteen occurrences in the body text. Fourteen in Chapter One alone. The word enters the book as a right, shifts to a claim, migrates to an assumption, and by its final appearance functions as the thing being contested. The semantic drift is visible only in the count.\n\nAntisemitism, ×37 / Palestinian, ×36. Ethan Katz, \"When Is Anti-Zionism Antisemitic?\" Two words in near-lockstep across 6,272 body words. One names the threat. The other names the people whose political claims are being sorted by the threat. The ratio is the essay's unconscious admission that it cannot discuss one without summoning the other.\n\n## NEW PAGE: EXERCISE 8 — TRANSLATE טשטוש\n\nA vocabulary quiz you cannot pass.\n\nIn his poem \"Exercises in Practical Hebrew,\" Dan Pagis wrote a language-textbook exercise that turns into the Holocaust mid-lesson. The form of the exercise is the joke and the horror at once: the orderly pedagogical structure cannot contain what it is being asked to teach.\n\nThis page borrows the form. Below is a real exercise. It uses a real word from a real political speech. There is no correct answer.\n\nTranslate: טשטוש (tishṭush).\n\nThe word appears in Israeli security and political discourse to describe the blurring of boundaries — between civilian and military authority, between institutional roles, between truth and its management. It derives from the root ט.ש.ט.ש, which in construction Hebrew means to plaster or skim-coat a wall.\n\nChoose the best English rendering:\n\n(a) Blurring — accurate to the visual metaphor; loses the physical register entirely. (b) Whitewashing — captures the cover-up connotation; imports a racial metaphor absent from the Hebrew. (c) Papering over — preserves the construction-trade register; loses the spatial and visual sense. (d) Obfuscation — semantically precise; sounds like a legal filing, not a political speech.\n\nEach answer is defensible. Each loses something the Hebrew carries without effort. The exercise teaches what translation always teaches: that no rendering is wrong, and none is the same as the original, and the gap between them is where the meaning lives.\n\nMore exercises, built from the same method: מרות (authority / subordination / the texture of being ruled), מזב\"ש (a military acronym for damage control that has become a civilian verb), שליח ציבור (the prayer leader who is also, literally, a public emissary — which is the religious sense and which is the political one?)."}</script>

function searchView(q){

  let html=head('Search all supplied text','Find a passage')+'<p class="build-note">'+hits.length+' matching pages and '+nhits.length+' matching editorial questions for “'+esc(q)+'”.</p>';
  html+=hits.map(p=>{const t=dash(p.text);const i=t.toLocaleLowerCase().indexOf(ql);const start=Math.max(0,i-90);const snip=t.slice(start,start+320);
    return '<section class="result"><div class="kind">'+esc(p.kind)+'</div><h2><a href="#'+p.id+'">'+highlight(label(p),q)+'</a></h2><p>'+(start?'…':'')+highlight(snip,q)+'…</p></section>'}).join('');
  html+=nhits.map(n=>{const p=pages.find(x=>x.id===n.page);return '<section class="result"><div class="kind">Editorial question · '+(p?esc(label(p)):'the build')+'</div><h2>'+(p?'<a href="#'+p.id+'">':'')+highlight(n.label,q)+(p?'</a>':'')+'</h2><p>'+highlight(n.observation,q)+' '+highlight(n.question,q)+'</p></section>'}).join('');
  if(!hits.length&&!nhits.length)html+='<div class="empty">No match. Try a shorter word or the Hebrew term itself.</div>';
  $('content').innerHTML=html+foot();
}
function foot(){return '<footer class="foot"><p>Reading copy v3 · the supplied v2 text, unchanged · no page is marked publication-ready.</p><p>'+(prefs.dashes==='converted'?'The reading view converts em dashes in the page text to semicolons or colons; titles, the exact-source view and the exports keep the supplied punctuation.':'Dashes are shown as written.')+' Boxes and headings regroup paragraphs on some pages; no wording is changed.</p><p>Authority note: the current decisions dated 3 October 2026 do not approve this website draft.</p></footer>'}

/* ---- shell ---- */
function message(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(message.t);message.t=setTimeout(()=>t.classList.add('hidden'),3500)}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function bindOptions(){document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-pressed','false'));if(!on)b.setAttribute('aria-pressed','true')}))}
function dashLabel(){$('dashes').textContent=prefs.dashes==='converted'?'Dashes: converted':'Dashes: as written';$('dashes').setAttribute('aria-pressed',String(prefs.dashes==='converted'))}
function render(){
  $('search').value='';
  const p=pages.find(x=>x.id===current);
  document.querySelectorAll('.nav-link').forEach(a=>{if(a.dataset.page===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  $('position').textContent=p?String(pages.indexOf(p)+1).padStart(2,'0')+' / '+pages.length+' · '+p.kind:TOOLS[current];
  $('tabs').classList.toggle('hidden',!p);$('copy-page').classList.toggle('hidden',!p);
  let html;
  if(p)html=pageView(p,false);
  else if(current==='index')html=indexView();
  else if(current==='audit')html=auditView();
  else if(current==='all')html=allView();
  else html=provenanceView();
  $('content').innerHTML=html+foot();
  if(p&&p.id==='exercise'&&view==='reading')bindOptions();
  document.title=(p?(p.id==='home'?'state-less':label(p)):TOOLS[current])+' · state-less';
}
function route(){let id=decodeURIComponent(location.hash.slice(1)||'home');if(!pages.some(p=>p.id===id)&&!TOOLS[id])id='index';current=id;$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'auto'})}

$('page-nav').innerHTML=pages.map((p,i)=>'<a class="nav-link" data-page="'+p.id+'" href="#'+p.id+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t">'+(p.id==='home'?'state-less':esc(label(p)))+'</span></a>').join('');
$('audit-label').textContent='Editorial questions ('+notes.length+')';
$('search').addEventListener('input',()=>{const q=$('search').value.trim();if(!q){render();$('search').focus();return}searchView(q)});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
$('menu').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))});
$('dashes').addEventListener('click',()=>{prefs.dashes=prefs.dashes==='converted'?'written':'converted';save();dashLabel();render()});
dashLabel();

const root=document.documentElement;
if(prefs.theme==='dark'||prefs.theme==='light')root.dataset.theme=prefs.theme;
const effective=()=>root.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function themeLabel(){const e=effective();$('theme').textContent=e==='dark'?'Light':'Dark';$('theme').setAttribute('aria-label','Switch to '+(e==='dark'?'light':'dark')+' theme')}
themeLabel();
$('theme').addEventListener('click',()=>{root.dataset.theme=effective()==='dark'?'light':'dark';prefs.theme=root.dataset.theme;save();themeLabel()});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeLabel);

$('export-md').addEventListener('click',()=>download('state-less-v2-source.md',DATA.source,'text/markdown;charset=utf-8'));
$('export-json').addEventListener('click',()=>download('state-less-v2-data.json',JSON.stringify(DATA,null,2),'application/json;charset=utf-8'));
$('print').addEventListener('click',()=>window.print());
$('copy-page').addEventListener('click',async()=>{const p=pages.find(x=>x.id===current);if(!p)return;const text=p.title+'\n\n'+p.text;
  try{if(!navigator.clipboard)throw new Error('clipboard');await navigator.clipboard.writeText(text);message('Exact supplied page text copied.')}
  catch(e){download(p.id+'.md','## '+p.title+'\n\n'+p.text,'text/markdown;charset=utf-8');message('Clipboard unavailable here; the page was downloaded instead.')}});
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
