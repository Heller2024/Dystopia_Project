<main id="main" class="main" tabindex="-1"><div class="toolbar"><span id="page-position" class="status">Supplied v2</span><div class="tabs" role="group" aria-label="Reading mode"><button data-view="reading" aria-pressed="true">Read</button><button data-view="audit" aria-pressed="false">Audit</button><button data-view="source" aria-pressed="false">Source</button></div><button id="copy-page">Copy page</button></div><article id="content"></article><noscript><h1>state-less</h1><p>This app uses JavaScript for navigation. The complete supplied text follows.</p><section><h2>HOME</h2><p>state-less</p><p>Walter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.</p><p>Hannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.</p><p>Gershom Scholem warned that secular Hebrew carried what he called an &quot;apocalyptic sting&quot; — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.</p><p>Yeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.</p><p>This site rereads. It checks the receipts.</p><p>Itay Eisinger · lecturer in Hebrew · Davis, California</p></section><section><h2>HOW WE GOT HERE AND WHERE WE ARE?</h2><p>This is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. &quot;How we got here&quot; assumes arrival. &quot;Where we are&quot; concedes that we do not know.</p><p>The texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.</p><p>The question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra&#x27;s curse was not that she was wrong.</p><p>This page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.</p></section><section><h2>EIN MEDINA</h2><p>אין מדינה. There is no state. In Israeli slang: nothing works, nobody&#x27;s in charge, the bus isn&#x27;t coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.</p><p>The phrase holds three ideas at once and this page holds all three.</p><p>The anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau&#x27;s 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.</p><p>The failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.</p><p>The slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.</p><p>A state can be sovereign and still be ein medina to the people it governs without representing.</p></section><section><h2>READING</h2><p>This is where texts get reread.</p><p>Each entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.</p><p>Jacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha&#x27;am), Violence (trauma as identity, shame as engine). Rose&#x27;s best sentence: &quot;When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.&quot; Her weakest move: finding messianism &quot;even when it does not know it is there&quot; — a claim no evidence can disconfirm.</p><p>Shaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.</p><p>David Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.</p><p>Amos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein&#x27;s introduction contains at least two internal contradictions, which is itself an instance of what the book describes.</p></section><section><h2>HISTORIANS ON HISTORIANS</h2><p>What happens when the child of a historian reads historians?</p><p>The historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact&#x27;s clothing.</p><p>Tom Segev and David Ohana write of the &quot;security state&quot; through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution&#x27;s brief. Both claim the archive. The archive does not arbitrate.</p><p>This page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.</p></section><section><h2>LINKD</h2><p>What this site is reading, using, and responding to. Updated when something earns its place here.</p></section><section><h2>NATION UNDOING</h2><p>The un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.</p><p>One reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.</p><p>Another reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism&#x27;s founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.</p><p>A third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid&#x27;s counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn&#x27;t exist. This is the hardest position on the site, because it refuses both defense and demolition.</p></section><section><h2>INFANTILIZATION</h2><p>The security establishment has a favorite grammatical move: conjugate the citizen as a child. &quot;Trust me&quot; and &quot;believe in me&quot; share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.</p><p>The emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.</p><p>Infantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. &quot;A servant when he becomes king&quot; — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.</p></section><section><h2>ZIONISM AND HISTORY, SON OF A HISTORIAN, LION</h2><p>The title is a note to self and it stays as one. The page is about what it&#x27;s like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.</p><p>There is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation&#x27;s answer was good enough. It never is, which is why the question keeps being asked.</p><p>Lion: Aryeh. A name. A father&#x27;s name, or a metaphor, or both. The page doesn&#x27;t owe the visitor an explanation. The title is honest about being unfinished.</p></section><section><h2>ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE</h2><p>The Golem of Prague was built to protect the Jews. It worked until it didn&#x27;t. The creature grew beyond its maker&#x27;s control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.</p><p>Ian Lustick argues that the discourse of antisemitism has become Israel&#x27;s golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; the invocation produces the very conflation of Jews and Israel that generates antisemitism; the new antisemitism is then cited as proof that the invocation was necessary. The loop is self-sealing. The golem cannot be turned off because turning it off would require admitting that the danger it was built to fight is partly the danger it creates.</p><p>This is not a claim that antisemitism is not real. It is a claim about what happens when a real phenomenon is put to work until the instrument becomes indistinguishable from the phenomenon. Katz&#x27;s taxonomy — critical vs. negationist anti-Zionism — is a golem in this sense: a sorting machine designed to protect, whose classifications generate the discretion they were supposed to eliminate.</p><p>The golem is the mythic register of the same argument that runs through this site in its political and scholarly registers. The state was built to protect. It protects. It also produces the conditions that require its protection. The circuit does not break from inside.</p></section><section><h2>THE TOO LATE-ZIONISM</h2><p>Belatedness is trauma&#x27;s own time signature. The event is known only afterward. The warning is readable only after the thing it warned against has happened. Cassandra is canonized retrospectively — given credit for seeing what nobody wanted to see, at the exact moment when seeing it no longer helps.</p><p>&quot;Too late&quot; is the temporal form of the site&#x27;s entire argument.</p><p>Ahad Ha&#x27;am was right in 1891, and it changed nothing. Kohn was right in 1929, and it changed nothing. By the time Leibowitz was right, in 1968, rightness itself had started to look like a symptom — the dissenter&#x27;s record growing longer and more accurate and less consequential with each decade. The dystopian novelists of the 1980s and 2000s imagined civil war, theocracy, the security state consuming itself. Their novels were reviewed and shelved.</p><p>&quot;Too late&quot; is also the tense of October 2023. The event after which the warnings could no longer be dismissed — and after which hearing them could no longer prevent what they warned against. The Declassified Page, the companion artifact to the book, ends with the sentence &quot;What began as a warning from the margins ends as testimony.&quot; That is the definition of too late: the moment when prophecy becomes record.</p><p>There is a Zionism that knows it is too late — that the project cannot deliver what it promised, that the costs have exceeded what the founders imagined, that the state has reproduced the conditions it was built to end — and continues anyway, because the alternative (abandonment, collapse, starting over) is also too late. This is the position nobody wants to occupy: the too-late Zionist, who cannot defend the project and cannot leave it. Much of what is written on this site is written from that position, or near it.</p></section><section><h2>NEW PAGE: CLOSE ENOUGH TO BE WRONG</h2><p>Things that went wrong when a sentence crossed a border.</p><p>&quot;79% of Israeli Jews don&#x27;t care about dead children in Gaza.&quot; That is what Shaul Magid told Haaretz in August 2025. The Israel Democracy Institute&#x27;s July 2025 survey actually asked whether respondents were personally troubled by reports of hunger and suffering among the Palestinian population in Gaza. Not &quot;care.&quot; Not &quot;children.&quot; Not &quot;dead.&quot; The 79% is a collapsed two-point band (almost not troubled + not at all troubled) whose internal breakdown the IDI did not publish on its summary page. Three distortions in one citation, each small enough to miss, each changing what the number means. The survey is real. The finding is real. What Magid said about it is not what it said about itself.</p><p>Four models read a poem. In 2012 I published a Hebrew poem in Haaretz. It is set at Ben-Gurion Airport — the statesman, not the destination. A drunk Russian literary ghost (Venedikt Yerofeyev, author of Moscow-Petushki) delivers a monologue at the departure gate. Four AI models were asked to translate it. Each one missed the Yerofeyev intertext. Each produced a different wrong poem. The errors were not random — each model resolved the ambiguity by choosing the most conventional reading available, which in every case meant flattening the joke. The poem survived translation only after the misreadings were identified and removed.</p><p>Ten translations of one letter. In February 2025, Rav Dov Landau published a letter declaring Zionism to be כפירה ומרידה במלכות שמים — heresy and rebellion against the Kingdom of Heaven. Ten English-language outlets translated the letter. Ten different renderings of שמד: apostasy, forced conversion, spiritual destruction, cultural erasure. Each translation is a theological argument pretending to be a word choice. None is wrong. None is the same as any other.</p><p>52 errors in seven articles. A corpus of Ynet news articles, audited for Hebrew-language errors: agreement violations, proscribed connectors, English calques, construct-chain problems. Opinion and long-form analysis carried the most errors. Short quote-driven news carried the fewest. The pattern is consistent enough to be structural: the further a text travels from its source, the more it degrades.</p><p>This page collects exhibits. The thesis is one sentence: meaning degrades when it crosses a border. The border can be a language, a survey methodology, a neural network, a newsroom style guide, or a theological tradition. The degradation is the evidence.</p></section><section><h2>NEW PAGE: IRAN, ×22</h2><p>Patrick Cockburn, The Jihadis Return: ISIS and the New Sunni Uprising (2014). A book about ISIS. Word search: &quot;Iran&quot; appears twenty-two times. &quot;Israel&quot; appears once.</p><p>The count is the argument. A book about the Islamic State in Iraq and Syria mentions Iran on nearly every other page and Israel on one page. This is not a gap in Cockburn&#x27;s knowledge. It is an accurate reflection of the regional dynamics that produced ISIS, in which Iranian influence, Saudi funding, and the collapse of the Iraqi state were the operative forces and Israel was peripheral. The count registers what the book&#x27;s own analysis knows but its Western readers may not expect: that the Middle East has a structure, and Israel is not always at its center.</p><p>This is the first entry in a series. Each one takes a text, counts a word, and lets the number do the arguing.</p><p>Self-determination, ×19. Shaul Magid, The Necessity of Exile. Nineteen occurrences in the body text. Fourteen in Chapter One alone. The word enters the book as a right, shifts to a claim, migrates to an assumption, and by its final appearance functions as the thing being contested. The semantic drift is visible only in the count.</p><p>Antisemitism, ×37 / Palestinian, ×36. Ethan Katz, &quot;When Is Anti-Zionism Antisemitic?&quot; Two words in near-lockstep across 6,272 body words. One names the threat. The other names the people whose political claims are being sorted by the threat. The ratio is the essay&#x27;s unconscious admission that it cannot discuss one without summoning the other.</p></section><section><h2>NEW PAGE: EXERCISE 8 — TRANSLATE טשטוש</h2><p>A vocabulary quiz you cannot pass.</p><p>In his poem &quot;Exercises in Practical Hebrew,&quot; Dan Pagis wrote a language-textbook exercise that turns into the Holocaust mid-lesson. The form of the exercise is the joke and the horror at once: the orderly pedagogical structure cannot contain what it is being asked to teach.</p><p>This page borrows the form. Below is a real exercise. It uses a real word from a real political speech. There is no correct answer.</p><p>Translate: טשטוש (tishṭush).</p><p>The word appears in Israeli security and political discourse to describe the blurring of boundaries — between civilian and military authority, between institutional roles, between truth and its management. It derives from the root ט.ש.ט.ש, which in construction Hebrew means to plaster or skim-coat a wall.</p><p>Choose the best English rendering:</p><p>(a) Blurring — accurate to the visual metaphor; loses the physical register entirely. (b) Whitewashing — captures the cover-up connotation; imports a racial metaphor absent from the Hebrew. (c) Papering over — preserves the construction-trade register; loses the spatial and visual sense. (d) Obfuscation — semantically precise; sounds like a legal filing, not a political speech.</p><p>Each answer is defensible. Each loses something the Hebrew carries without effort. The exercise teaches what translation always teaches: that no rendering is wrong, and none is the same as the original, and the gap between them is where the meaning lives.</p><p>More exercises, built from the same method: מרות (authority / subordination / the texture of being ruled), מזב&quot;ש (a military acronym for damage control that has become a civilian verb), שליח ציבור (the prayer leader who is also, literally, a public emissary — which is the religious sense and which is the political one?).</p></section></noscript></main></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script id="app-data" type="application/json">{"pages": [{"id": "home", "title": "HOME", "text": "state-less\n\nWalter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.\n\nHannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.\n\nGershom Scholem warned that secular Hebrew carried what he called an \"apocalyptic sting\" — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.\n\nYeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.\n\nThis site rereads. It checks the receipts.\n\nItay Eisinger · lecturer in Hebrew · Davis, California", "kind": "Entrance"}, {"id": "how-we-got-here", "title": "HOW WE GOT HERE AND WHERE WE ARE?", "text": "This is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. \"How we got here\" assumes arrival. \"Where we are\" concedes that we do not know.\n\nThe texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.\n\nThe question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra's curse was not that she was wrong.\n\nThis page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.", "kind": "Essay"}, {"id": "ein-medina", "title": "EIN MEDINA", "text": "אין מדינה. There is no state. In Israeli slang: nothing works, nobody's in charge, the bus isn't coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.\n\nThe phrase holds three ideas at once and this page holds all three.\n\nThe anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau's 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.\n\nThe failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.\n\nThe slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.\n\nA state can be sovereign and still be ein medina to the people it governs without representing.", "kind": "Essay"}, {"id": "reading", "title": "READING", "text": "This is where texts get reread.\n\nEach entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.\n\nJacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha'am), Violence (trauma as identity, shame as engine). Rose's best sentence: \"When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.\" Her weakest move: finding messianism \"even when it does not know it is there\" — a claim no evidence can disconfirm.\n\nShaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.\n\nDavid Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.\n\nAmos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein's introduction contains at least two internal contradictions, which is itself an instance of what the book describes.", "kind": "Reading"}, {"id": "historians", "title": "HISTORIANS ON HISTORIANS", "text": "What happens when the child of a historian reads historians?\n\nThe historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact's clothing.\n\nTom Segev and David Ohana write of the \"security state\" through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution's brief. Both claim the archive. The archive does not arbitrate.\n\nThis page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.", "kind": "Essay"}, {"id": "linkd", "title": "LINKD", "text": "What this site is reading, using, and responding to. Updated when something earns its place here.", "kind": "Links"}, {"id": "nation-undoing", "title": "NATION UNDOING", "text": "The un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.\n\nOne reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.\n\nAnother reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism's founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.\n\nA third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid's counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn't exist. This is the hardest position on the site, because it refuses both defense and demolition.", "kind": "Essay"}, {"id": "infantilization", "title": "INFANTILIZATION", "text": "The security establishment has a favorite grammatical move: conjugate the citizen as a child. \"Trust me\" and \"believe in me\" share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.\n\nThe emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.\n\nInfantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. \"A servant when he becomes king\" — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.", "kind": "Essay"}, {"id": "son-of-a-historian", "title": "ZIONISM AND HISTORY, SON OF A HISTORIAN, LION", "text": "The title is a note to self and it stays as one. The page is about what it's like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.\n\nThere is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation's answer was good enough. It never is, which is why the question keeps being asked.\n\nLion: Aryeh. A name. A father's name, or a metaphor, or both. The page doesn't owe the visitor an explanation. The title is honest about being unfinished.", "kind": "Essay"}, {"id": "golem", "title": "ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE", "text": "The Golem of Prague was built to protect the Jews. It worked until it didn't. The creature grew beyond its maker's control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.\n\nIan Lustick argues that the discourse of antisemitism has become Israel's golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; brication."}, {"page": "audit", "label": "Draft is not locked", "observation": "Earlier replies called their own text canonical or locked pending approval and described files as written without delivering an attachment. Those are not author approvals or evidence of completed file delivery.", "question": "Uncertain: choose what to approve after reviewing this actual artifact."}, {"page": "audit", "label": "Model-review coverage", "observation": "The chat contains named-model reports and council summaries. This build preserves their status as reports; it has not independently run three models.", "question": "Uncertain: assess recommendations by their supporting passages, not model agreement alone."}], "source": "state-less — page content (v2)\nIncorporates: three sourcing fixes (Zini, Morris, Scholem verification note), the overclaim fix on Ein Medina, the escalating cadence on Too Late, the Ein Medina closer, the Infantilization rewrite, plus three new pages (the unverifiable-quote exhibit, the counting method, and the first Exercises in Practical Hebrew post).\n\n## HOME\n\nstate-less\n\nWalter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.\n\nHannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.\n\nGershom Scholem warned that secular Hebrew carried what he called an \"apocalyptic sting\" — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.\n\nYeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.\n\nThis site rereads. It checks the receipts.\n\nItay Eisinger · lecturer in Hebrew · Davis, California\n\n## HOW WE GOT HERE AND WHERE WE ARE?\n\nThis is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. \"How we got here\" assumes arrival. \"Where we are\" concedes that we do not know.\n\nThe texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.\n\nThe question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra's curse was not that she was wrong.\n\nThis page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.\n\n## EIN MEDINA\n\nאין מדינה. There is no state. In Israeli slang: nothing works, nobody's in charge, the bus isn't coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.\n\nThe phrase holds three ideas at once and this page holds all three.\n\nThe anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau's 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.\n\nThe failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.\n\nThe slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.\n\nA state can be sovereign and still be ein medina to the people it governs without representing.\n\n## READING\n\nThis is where texts get reread.\n\nEach entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.\n\nJacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha'am), Violence (trauma as identity, shame as engine). Rose's best sentence: \"When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.\" Her weakest move: finding messianism \"even when it does not know it is there\" — a claim no evidence can disconfirm.\n\nShaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.\n\nDavid Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.\n\nAmos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein's introduction contains at least two internal contradictions, which is itself an instance of what the book describes.\n\n## HISTORIANS ON HISTORIANS\n\nWhat happens when the child of a historian reads historians?\n\nThe historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact's clothing.\n\nTom Segev and David Ohana write of the \"security state\" through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution's brief. Both claim the archive. The archive does not arbitrate.\n\nThis page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.\n\n## LINKD\n\nWhat this site is reading, using, and responding to. Updated when something earns its place here.\n\n## NATION UNDOING\n\nThe un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.\n\nOne reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.\n\nAnother reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism's founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.\n\nA third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid's counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn't exist. This is the hardest position on the site, because it refuses both defense and demolition.\n\n## INFANTILIZATION\n\nThe security establishment has a favorite grammatical move: conjugate the citizen as a child. \"Trust me\" and \"believe in me\" share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.\n\nThe emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.\n\nInfantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. \"A servant when he becomes king\" — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.\n\n## ZIONISM AND HISTORY, SON OF A HISTORIAN, LION\n\nThe title is a note to self and it stays as one. The page is about what it's like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.\n\nThere is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation's answer was good enough. It never is, which is why the question keeps being asked.\n\nLion: Aryeh. A name. A father's name, or a metaphor, or both. The page doesn't owe the visitor an explanation. The title is honest about being unfinished.\n\n## ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE\n\nThe Golem of Prague was built to protect the Jews. It worked until it didn't. The creature grew beyond its maker's control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.\n\nIan Lustick argues that the discourse of antisemitism has become Israel's golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; the invocation produces the very conflation of Jews and Israel that generates antisemitism; the new antisemitism is then cited as proof that the invocation was necessary. The loop is self-sealing. The golem cannot be turned off because turning it off would require admitting that the danger it was built to fight is partly the danger it creates.\n\nThis is not a claim that antisemitism is not real. It is a claim about what happens when a real phenomenon is put to work until the instrument becomes indistinguishable from the phenomenon. Katz's taxonomy — critical vs. negationist anti-Zionism — is a golem in this sense: a sorting machine designed to protect, whose classifications generate the discretion they were supposed to eliminate.\n\nThe golem is the mythic register of the same argument that runs through this site in its political and scholarly registers. The state was built to protect. It protects. It also produces the conditions that require its protection. The circuit does not break from inside.\n\n## THE TOO LATE-ZIONISM\n\nBelatedness is trauma's own time signature. The event is known only afterward. The warning is readable only after the thing it warned against has happened. Cassandra is canonized retrospectively — given credit for seeing what nobody wanted to see, at the exact moment when seeing it no longer helps.\n\n\"Too late\" is the temporal form of the site's entire argument.\n\nAhad Ha'am was right in 1891, and it changed nothing. Kohn was right in 1929, and it changed nothing. By the time Leibowitz was right, in 1968, rightness itself had started to look like a symptom — the dissenter's record growing longer and more accurate and less consequential with each decade. The dystopian novelists of the 1980s and 2000s imagined civil war, theocracy, the security state consuming itself. Their novels were reviewed and shelved.\n\n\"Too late\" is also the tense of October 2023. The event after which the warnings could no longer be dismissed — and after which hearing them could no longer prevent what they warned against. The Declassified Page, the companion artifact to the book, ends with the sentence \"What began as a warning from the margins ends as testimony.\" That is the definition of too late: the moment when prophecy becomes record.\n\nThere is a Zionism that knows it is too late — that the project cannot deliver what it promised, that the costs have exceeded what the founders imagined, that the state has reproduced the conditions it was built to end — and continues anyway, because the alternative (abandonment, collapse, starting over) is also too late. This is the position nobody wants to occupy: the too-late Zionist, who cannot defend the project and cannot leave it. Much of what is written on this site is written from that position, or near it.\n\n## NEW PAGE: CLOSE ENOUGH TO BE WRONG\n\nThings that went wrong when a sentence crossed a border.\n\n\"79% of Israeli Jews don't care about dead children in Gaza.\" That is what Shaul Magid told Haaretz in August 2025. The Israel Democracy Institute's July 2025 survey actually asked whether respondents were personally troubled by reports of hunger and suffering among the Palestinian population in Gaza. Not \"care.\" Not \"children.\" Not \"dead.\" The 79% is a collapsed two-point band (almost not troubled + not at all troubled) whose internal breakdown the IDI did not publish on its summary page. Three distortions in one citation, each small enough to miss, each changing what the number means. The survey is real. The finding is real. What Magid said about it is not what it said about itself.\n\nFour models read a poem. In 2012 I published a Hebrew poem in Haaretz. It is set at Ben-Gurion Airport — the statesman, not the destination. A drunk Russian literary ghost (Venedikt Yerofeyev, author of Moscow-Petushki) delivers a monologue at the departure gate. Four AI models were asked to translate it. Each one missed the Yerofeyev intertext. Each produced a different wrong poem. The errors were not random — each model resolved the ambiguity by choosing the most conventional reading available, which in every case meant flattening the joke. The poem survived translation only after the misreadings were identified and removed.\n\nTen translations of one letter. In February 2025, Rav Dov Landau published a letter declaring Zionism to be כפירה ומרידה במלכות שמים — heresy and rebellion against the Kingdom of Heaven. Ten English-language outlets translated the letter. Ten different renderings of שמד: apostasy, forced conversion, spiritual destruction, cultural erasure. Each translation is a theological argument pretending to be a word choice. None is wrong. None is the same as any other.\n\n52 errors in seven articles. A corpus of Ynet news articles, audited for Hebrew-language errors: agreement violations, proscribed connectors, English calques, construct-chain problems. Opinion and long-form analysis carried the most errors. Short quote-driven news carried the fewest. The pattern is consistent enough to be structural: the further a text travels from its source, the more it degrades.\n\nThis page collects exhibits. The thesis is one sentence: meaning degrades when it crosses a border. The border can be a language, a survey methodology, a neural network, a newsroom style guide, or a theological tradition. The degradation is the evidence.\n\n## NEW PAGE: IRAN, ×22\n\nPatrick Cockburn, The Jihadis Return: ISIS and the New Sunni Uprising (2014). A book about ISIS. Word search: \"Iran\" appears twenty-two times. \"Israel\" appears once.\n\nThe count is the argument. A book about the Islamic State in Iraq and Syria mentions Iran on nearly every other page and Israel on one page. This is not a gap in Cockburn's knowledge. It is an accurate reflection of the regional dynamics that produced ISIS, in which Iranian influence, Saudi funding, and the collapse of the Iraqi state were the operative forces and Israel was peripheral. The count registers what the book's own analysis knows but its Western readers may not expect: that the Middle East has a structure, and Israel is not always at its center.\n\nThis is the first entry in a series. Each one takes a text, counts a word, and lets the number do the arguing.\n\nSelf-determination, ×19. Shaul Magid, The Necessity of Exile. Nineteen occurrences in the body text. Fourteen in Chapter One alone. The word enters the book as a right, shifts to a claim, migrates to an assumption, and by its final appearance functions as the thing being contested. The semantic drift is visible only in the count.\n\nAntisemitism, ×37 / Palestinian, ×36. Ethan Katz, \"When Is Anti-Zionism Antisemitic?\" Two words in near-lockstep across 6,272 body words. One names the threat. The other names the people whose political claims are being sorted by the threat. The ratio is the essay's unconscious admission that it cannot discuss one without summoning the other.\n\n## NEW PAGE: EXERCISE 8 — TRANSLATE טשטוש\n\nA vocabulary quiz you cannot pass.\n\nIn his poem \"Exercises in Practical Hebrew,\" Dan Pagis wrote a language-textbook exercise that turns into the Holocaust mid-lesson. The form of the exercise is the joke and the horror at once: the orderly pedagogical structure cannot contain what it is being asked to teach.\n\nThis page borrows the form. Below is a real exercise. It uses a real word from a real political speech. There is no correct answer.\n\nTranslate: טשטוש (tishṭush).\n\nThe word appears in Israeli security and political discourse to describe the blurring of boundaries — between civilian and military authority, between institutional roles, between truth and its management. It derives from the root ט.ש.ט.ש, which in construction Hebrew means to plaster or skim-coat a wall.\n\nChoose the best English rendering:\n\n(a) Blurring — accurate to the visual metaphor; loses the physical register entirely. (b) Whitewashing — captures the cover-up connotation; imports a racial metaphor absent from the Hebrew. (c) Papering over — preserves the construction-trade register; loses the spatial and visual sense. (d) Obfuscation — semantically precise; sounds like a legal filing, not a political speech.\n\nEach answer is defensible. Each loses something the Hebrew carries without effort. The exercise teaches what translation always teaches: that no rendering is wrong, and none is the same as the original, and the gap between them is where the meaning lives.\n\nMore exercises, built from the same method: מרות (authority / subordination / the texture of being ruled), מזב\"ש (a military acronym for damage control that has become a civilian verb), שליח ציבור (the prayer leader who is also, literally, a public emissary — which is the religious sense and which is the political one?)."}</script><script>

function bindQuizReset(){document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed','false'));selection=null;el('feedback').innerHTML='<p>Select an option. The notes are the supplied draft’s interpretation, not verified dictionary entries.</p>'}
function footer(){return '<footer class="footer"><p>Working prototype · supplied v2 text · no material marked publication-ready.</p><p>Reading view changes em dashes to semicolons or colons only. Source view and exports retain the supplied punctuation. No claim-level rewriting has been applied.</p><p>Authority note: <code>decison.md.pdf</code>, page 1, current decisions dated 3 October 2026. “Warning to testimony is my idea and wording.” The same page identifies Leibowitz’s 1968 secret-police state as the book’s spine. These decisions do not approve this website draft.</p></footer>'}
function render(){el('search').value='';const p=pages.find(x=>x.id===current);document.querySelectorAll('.nav-link').forEach(a=>{if(a.dataset.page===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));el('page-position').textContent=p?String(pages.indexOf(p)+1).padStart(2,'0')+' / '+pages.length+' · '+p.kind:'Workspace';el('copy-page').classList.toggle('hidden',!p);let html='';
if(current==='index'){html='<div class="kicker">The supplied v2, in full</div><h1 class="view-title">An index of the pages.</h1><p class="subline">Open any page to read, inspect its editorial questions, or view the exact supplied text.</p><div class="cards">'+pages.map((x,i)=>'<section class="index-card"><div class="kicker">'+String(i+1).padStart(2,'0')+' · '+esc(x.kind)+'</div><h2><a href="#'+x.id+'">'+esc(label(x))+'</a></h2><p>'+esc(typography(x.text.split('\n\n')[x.id==='home'?1:0]).slice(0,200))+(x.text.length>200?'…':'')+'</p></section>').join('')+'</div>'}
else if(current==='audit'){html='<div class="kicker">Editorial layer, not source text</div><h1 class="view-title">What the earlier audits missed.</h1><div class="seal">Coverage: visible chat and supplied v2. This is a consistency and provenance audit, not an independent fact-check of the research.</div>'+notes.map(n=>'<section class="audit-note"><h3>'+esc(n.label)+'</h3><p>'+esc(n.observation)+'</p><p>'+esc(n.question)+'</p>'+(n.page!=='audit'?'<a class="inline-link" href="#'+n.page+'">Read the relevant page →</a>':'')+'</section>').join('')}
else if(current==='all'){html='<div class="kicker">Complete reading view</div><h1>state-less</h1><div class="seal">All supplied v2 pages. Typography-only changes; editorial notes remain separate.</div>'+pages.map(x=>pageHTML(x,true)).join('')}
else if(current==='provenance'){html='<div class="kicker">Source and boundaries</div><h1 class="view-title">What is preserved.</h1><div class="prose"><p>This app includes the complete page text pasted under “state-less — page content (v2).” That pasted text is the build input. The earlier attachment and assistant drafts are not silently substituted for it.</p><p>Supplied does not mean independently verified, author-written, or approved. Earlier model suggestions remain suggestions. Unresolved claims are preserved as draft content and listed in the editorial layer.</p><p>The prior conversation requested three-model review and includes reports attributed to three models. This build has not run those models. It does not convert their agreement into evidence.</p><p>The v2 preface promises an unverifiable-quote exhibit. No such page occurs in the supplied v2 body. It has not been invented or inserted. A corrections log would likewise need approved entries rather than an invented publication history.</p><p>The HTML runs locally without remote fonts, images, scripts, analytics, or server calls. It does not publish to Webador or change the live site. No settings or exercise answers are saved after reloading.</p><p>Keyboard: Tab to controls; Enter or Space to activate buttons. Hash links make individual pages bookmarkable. Print view removes the app controls.</p></div><h2>Supplied version preface</h2><div class="source-text">'+esc(DATA.source.split('\n\n')[0])+'</div>'}
else if(p){html='<div class="kicker">'+esc(p.kind)+' · supplied v2</div><h1 class="view-title">'+esc(p.id==='home'?'state-less':label(p))+'</h1>';
if(view==='source')html+='<div class="seal">Exact supplied wording and punctuation. No automatic corrections.</div><div class="source-text">'+esc(p.text)+'</div>';
else{html+='<div class="seal">Draft text preserved. Source claims and quotations have not been independently verified in this build.</div>'+pageHTML(p);if(p.id==='exercise')html+=quizHTML();const ns=notes.filter(n=>n.page===p.id);if(ns.length)html+='<section class="note-panel" aria-label="Editorial questions"><h2>'+(view==='audit'?'Editorial observations':'Before publication')+'</h2>'+ns.map(n=>noteHTML(n,view==='audit')).join('')+'</section>';}
const i=pages.indexOf(p);html+='<nav class="page-actions" aria-label="Adjacent pages">'+(i?'<button data-go="'+pages[i-1].id+'">← Previous page</button>':'')+'<button data-go="index">All pages</button>'+(i<pages.length-1?'<button data-go="'+pages[i+1].id+'">Next page →</button>':'')+'</nav>';}
el('content').innerHTML=html+footer();document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>location.hash=b.dataset.go));if(p&&p.id==='exercise'&&view!=='source')bindQuiz();document.title=(p?label(p):current==='audit'?'Editorial audit':'state-less')+' · state-less';}
function route(){let id=decodeURIComponent(location.hash.slice(1)||'home');if(!pages.some(p=>p.id===id)&&!['index','audit','all','provenance'].includes(id))id='index';current=id;el('sidebar').classList.remove('open');el('mobile-menu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'auto'})}
function highlight(s,q){const low=s.toLocaleLowerCase(),term=q.toLocaleLowerCase();let pos=0,html='',i;while((i=low.indexOf(term,pos))!==-1){html+=esc(s.slice(pos,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>';pos=i+q.length}return html+esc(s.slice(pos))}
function search(){const q=el('search').value.trim();if(!q){render();el('search').focus();return}const hits=pages.filter(p=>(p.title+' '+p.text).toLocaleLowerCase().includes(q.toLocaleLowerCase()));el('page-position').textContent=hits.length+' matching pages';el('copy-page').classList.add('hidden');let html='<div class="kicker">Search all supplied page text</div><h1>Find a passage.</h1><p class="subline">'+hits.length+' matching pages for “'+esc(q)+'”.</p>';html+=hits.length?hits.map(p=>{const i=p.text.toLocaleLowerCase().indexOf(q.toLocaleLowerCase());const start=Math.max(0,i-90);const snippet=p.text.slice(start,start+320);return '<section class="search-result"><h2><a href="#'+p.id+'">'+highlight(label(p),q)+'</a></h2><p>'+(start?'…':'')+highlight(typography(snippet),q)+'…</p></section>'}).join(''):'<div class="empty"><p>No matching page. Try a shorter word or an original Hebrew term.</p><button id="clear-search">Clear search</button></div>';el('content').innerHTML=html+footer();const clear=el('clear-search');if(clear)clear.addEventListener('click',()=>{render();el('search').focus()})}
el('page-nav').innerHTML=pages.map((p,i)=>'<a class="nav-link" data-page="'+p.id+'" href="#'+p.id+'"><span>'+String(i+1).padStart(2,'0')+'</span><span>'+esc(label(p))+'</span></a>').join('');
el('search').addEventListener('input',search);document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
el('mobile-menu').addEventListener('click',()=>{const open=el('sidebar').classList.toggle('open');el('mobile-menu').setAttribute('aria-expanded',String(open))});
const root=document.documentElement;root.dataset.theme=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function themeLabel(){el('theme').textContent=root.dataset.theme==='dark'?'Light':'Dark';el('theme').setAttribute('aria-label','Switch to '+(root.dataset.theme==='dark'?'light':'dark')+' mode')}themeLabel();el('theme').addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';themeLabel()});
el('export-md').addEventListener('click',()=>download('state-less-v2-source.md',DATA.source,'text/markdown;charset=utf-8'));
el('export-data').addEventListener('click',()=>download('state-less-v2-data.json',JSON.stringify(DATA,null,2),'application/json;charset=utf-8'));
el('print').addEventListener('click',()=>window.print());
el('copy-page').addEventListener('click',async()=>{const p=pages.find(x=>x.id===current);if(!p)return;try{if(!navigator.clipboard)throw new Error('clipboard');await navigator.clipboard.writeText(p.title+'\n\n'+p.text);message('Exact supplied page text copied.')}catch(e){download(p.id+'.md','## '+p.title+'\n\n'+p.text,'text/markdown;charset=utf-8');message('Clipboard unavailable locally; downloaded the page instead.')}});
window.addEventListener('hashchange',route);route();
</script></body></html>
