<script id="app-data" type="application/json">{"pages": [{"id": "home", "title": "HOME", "text": "state-less\n\nWalter Benjamin fled through the Pyrenees and died at the border. The state he fled had made him stateless; the state he was trying to reach refused him entry.\n\nHannah Arendt wrote that the nation-state, having invented human rights, immediately produced a class of people to whom they did not apply.\n\nGershom Scholem warned that secular Hebrew carried what he called an \"apocalyptic sting\" — a sacred language conscripted into daily use, its theological charge intact beneath the surface of every bus schedule and government memo.\n\nYeshayahu Leibowitz said in 1968 that ruling over the Palestinians would turn Israel into a secret-police state. He was treated as a crank. He described the present.\n\nThis site rereads. It checks the receipts.\n\nItay Eisinger · lecturer in Hebrew · Davis, California", "kind": "Entrance"}, {"id": "how-we-got-here", "title": "HOW WE GOT HERE AND WHERE WE ARE?", "text": "This is the question you ask when the event has already happened and you need to understand why nobody stopped it. It is a belated question by definition. \"How we got here\" assumes arrival. \"Where we are\" concedes that we do not know.\n\nThe texts gathered on this site were written before October 2023, most of them decades before. Some are dystopian novels that imagined what Israeli society might become. Some are philosophical arguments about what statehood costs. Some are predictions that came true and were forgotten precisely because they came true — predictions about occupation, about messianism entering politics, about the corruption of language, about what happens when a nation organizes its identity around a wound.\n\nThe question is not whether the warnings were right. Many of them were, and that is now an empirical claim, not a political one. The question is what made them unhearable when hearing them might still have mattered. Cassandra's curse was not that she was wrong.\n\nThis page is the table of contents. Every other page on this site is an attempt to answer one part of the question in the title.", "kind": "Essay"}, {"id": "ein-medina", "title": "EIN MEDINA", "text": "אין מדינה. There is no state. In Israeli slang: nothing works, nobody's in charge, the bus isn't coming. In political theology: the condition before sovereignty, or after it, or in spite of it. In Arendt: the condition of the people to whom rights do not apply because no state will claim them.\n\nThe phrase holds three ideas at once and this page holds all three.\n\nThe anti-statist argument. A tradition of Jewish thought — Leibowitz, the early Buber, the American Council for Judaism, the Haredi signatories of every generation including Rav Dov Landau's 2025 letter — has held that Jewish life does not require a sovereign state and may be damaged by one. This is not a fringe position. It is older than the state it opposes. It was the majority position among religious Jews before 1948 and remains the doctrinal position of significant Haredi communities today.\n\nThe failed-state argument. A different claim: not that the state was unnecessary but that it failed by its own criteria. Zionism promised to resolve the Jewish question — to end exile, to end danger, to normalize Jewish existence. Whether that counts as failure is contestable. That it counts as repetition is not. The state reproduces the conditions it was designed to cure: danger, displacement, a population that cannot take its safety for granted.\n\nThe slang. Ein medina — nothing works — is what Israelis say about their own bureaucracy, their own politics, their own daily dysfunction. It is also, read literally, the negation of the premise on which the country was founded. The joke and the critique inhabit the same phrase, and neither knows it is sharing a room with the other.\n\nA state can be sovereign and still be ein medina to the people it governs without representing.", "kind": "Essay"}, {"id": "reading", "title": "READING", "text": "This is where texts get reread.\n\nEach entry below is a reading — not a review, not a summary, but an attempt to find what a text knew that its own moment could not hear.\n\nJacqueline Rose, The Question of Zion (2005) Three chapters, no synthesis. Vision (messianism as the unconscious substrate of secular Zionism), Critique (the repressed dissenters — Buber, Kohn, Arendt, Ahad Ha'am), Violence (trauma as identity, shame as engine). Rose's best sentence: \"When suffering becomes an identity, it has to turn cruel in order to be able to bear, or live with, itself.\" Her weakest move: finding messianism \"even when it does not know it is there\" — a claim no evidence can disconfirm.\n\nShaul Magid, The Necessity of Exile (2023) Counter-Zionism from inside the rabbinate. The strongest chapter is on Rav Shagar: postmodern faith as a way to hold Zionism without being held by it. The weakest is on Teitelbaum, where the Kasztner omission is, as one reviewer wrote, conspicuous. The reception map is its own story: JRB calls it utopian, Commentary calls it magical thinking, The Nation calls it insufficiently Palestinian. All three are partly right, and the pattern tells you more about American Jewish discourse than about the book.\n\nDavid Biale, Gershom Scholem: Master of the Kabbalah The question this book circles: did Scholem think Zionism was a utopian return to history? Follow the evidence through Chapter 8 and the answer is: not quite. Scholem applied the utopian-return formula to the messianic tradition, not to the state. Biale sometimes elides the distinction. It matters.\n\nAmos Funkenstein, Perceptions of Jewish History Counterhistory as method — the genre that narrates against its own tradition. Funkenstein's introduction contains at least two internal contradictions, which is itself an instance of what the book describes.", "kind": "Reading"}, {"id": "historians", "title": "HISTORIANS ON HISTORIANS", "text": "What happens when the child of a historian reads historians?\n\nThe historiography of Zionism is not a neutral enterprise. To write the history of a national movement is to participate in the argument about whether that movement was necessary, whether it succeeded, and whether its consequences can be borne. Every historian of Zionism is also a witness for or against it. The historians disagree about facts, but they disagree more consequentially about what counts as a fact and what counts as an interpretation wearing a fact's clothing.\n\nTom Segev and David Ohana write of the \"security state\" through the figures of Sparta and Masada — the garrison state and the suicidal last stand. Benny Morris supplied the empirical findings the left needed and the political conclusions the right wanted — proof that an archive can be shared by people who agree on nothing else. Anita Shapira wrote the authorized version; Ilan Pappé wrote the prosecution's brief. Both claim the archive. The archive does not arbitrate.\n\nThis page is about the people who write the past, and about what it means to have grown up in the room where the past was being written.", "kind": "Essay"}, {"id": "linkd", "title": "LINKD", "text": "What this site is reading, using, and responding to. Updated when something earns its place here.", "kind": "Links"}, {"id": "nation-undoing", "title": "NATION UNDOING", "text": "The un- prefix runs through this site. Utopia Undone. The Undone Archive. Unheeded warnings. Untranslated words. Something is being undone, and the texts collected here disagree about what it is.\n\nOne reading: Israel is undoing itself — its democratic institutions, its founding bargains, its secular character, its relations with the diaspora. This is the thesis of the dystopian novels (Kenan, Tammuz, and their twenty-first-century successors) and it is the thesis of the departing security chiefs, each of whom warned, on the way out, that the state is consuming itself.\n\nAnother reading: the nation was always undoing something else — the diaspora, the exile, the old Jewish life — and the current unraveling is the cost of that prior undoing catching up. Shlilat ha-golah, the negation of exile, was Zionism's founding gesture. If what you negated turns out to have been load-bearing, the structure eventually fails.\n\nA third: undoing is not destruction. It can be the first move of revision — the seam-ripper before the re-cut. Magid's counter-Zionism proposes thinking through Zionism rather than against it, which requires unmaking some of its premises without pretending the fabric doesn't exist. This is the hardest position on the site, because it refuses both defense and demolition.", "kind": "Essay"}, {"id": "infantilization", "title": "INFANTILIZATION", "text": "The security establishment has a favorite grammatical move: conjugate the citizen as a child. \"Trust me\" and \"believe in me\" share a root in Hebrew — א.מ.ן — for a reason. אמון (trust), אמונה (faith), נאמנות (loyalty): three words from one root, each asking the citizen to stop evaluating and start obeying. The state would rather be believed than examined.\n\nThe emotional turn in Israeli political speech is not a shift from rational discourse to irrational discourse. It is a shift in what the same affective vocabulary is attached to. When security chiefs speak of loyalty, they used to mean loyalty to the state and its institutions. In recent years the same word has migrated: loyalty to the leader, loyalty to the coalition, loyalty to the party that appointed you. The vocabulary is stable. The object has moved. Tracking that migration — who says נאמנות and to whom — is an empirical project, not a polemic.\n\nInfantilization is the citizen-side of this shift. The security establishment speaks in the language of mature responsibility; the public is expected to trust, not to evaluate. \"A servant when he becomes king\" — Proverbs 30:22, one of the four things the earth cannot bear — is the verse the establishment uses to describe politicians who took power without earning it. The citizen is positioned somewhere below both: the child who must not ask whether the wound is still bleeding or whether the guardian is still guarding.", "kind": "Essay"}, {"id": "son-of-a-historian", "title": "ZIONISM AND HISTORY, SON OF A HISTORIAN, LION", "text": "The title is a note to self and it stays as one. The page is about what it's like to think about Zionism when your father wrote about history, and about what that inheritance does to the writing.\n\nThere is a genre of Israeli intellectual work that is also, underneath, a family argument. The son of the historian reads the historians his father read, and reads them differently, and does not always know whether the difference is intellectual or biographical. Funkenstein and Biale and Scholem sit on the shelf in the same room where the arguments about the past were had over dinner. The question — was the state necessary, did it work, can it be saved — is never only a question about the state. It is also a question about whether the previous generation's answer was good enough. It never is, which is why the question keeps being asked.\n\nLion: Aryeh. A name. A father's name, or a metaphor, or both. The page doesn't owe the visitor an explanation. The title is honest about being unfinished.", "kind": "Essay"}, {"id": "golem", "title": "ANTISEMITISM GOLEM — LUSTICK, ZIONISM AS, DANGER, PERPETUATE", "text": "The Golem of Prague was built to protect the Jews. It worked until it didn't. The creature grew beyond its maker's control and had to be destroyed — or, in some versions, deactivated and stored in the attic of the Old New Synagogue, where it waits.\n\nIan Lustick argues that the discourse of antisemitism has become Israel's golem: a protective instrument that now endangers its maker. The state invokes antisemitism to delegitimize criticism; the invocation produces the very conflation of Jews and Israel that generates antisemitism; the new antisemitism is then cited as proof that the invocation was necessary. The loop is self-sealing. The golem cannot be turned off because turning it off would require admitting that the danger it was built to fight is partly the danger it creates.\n\nThis is not a claim that antisemitism is not real. It is a claim about what happens when a real phenomenon is put to work until the instrument becomes indistinguishable from the phenomenon. Katz's taxonomy — critical vs. negationist anti-Zionism — is a golem in this sense: a sorting machine designed to protect, whose classifications generate the discretion they were supposed to eliminate.\n\nThe golem is the mythic register of the same argument that runs through this site in its political and scholarly registers. The state was built to protect. It protects. It also produces the conditions that require its protection. The circuit does not break from inside.", "kind": "Essay"}, {"id": "too-late", "title": "ON LATE-CAPITALISM AND TOO-LATE ZIONISM", "text": "Belatedness is trauma's own time signature. The event is known only afterward. The warning is readable only after the thing it warned against has happened. Cassandra is canonized retrospectively — given credit for seeing what nobody wanted to see, at the exact moment when seeing it no longer helps.\n\n\"Too late\" is the temporal form of the site's entire argument.\n\nAhad Ha'am was right in 1891, and it changed nothing. Kohn was right in 1929, and it changed nothing. By the time Leibowitz was right, in 1968, rightness itself had started to look like a symptom — the dissenter's record growing longer and more accurate and less consequential with each decade. The dystopian novelists of the 1980s and 2000s imagined civil war, theocracy, the security state consuming itself. Their novels were reviewed and shelved.\n\n\"Too late\" is also the tense of October 7. The event after which the warnings could no longer be dismissed — and after which hearing them could no longer prevent what they warned against. The Declassified Page, the companion artifact to the book, ends with the sentence \"What began as a warning from the margins ends as testimony.\" That is the definition of too late: the moment when prophecy becomes record.\n\nThere is a Zionism that knows it is too late — that the project cannot deliver what it promised, that the costs have exceeded what the founders imagined, that the state has reproduced the conditions it was built to end — and continues anyway, because the alternative (abandonment, collapse, starting over) is also too late. This is the position nobody wants to occupy: the too-late Zionist, who cannot defend the project and cannot leave it. Much of what is written on this site is written from that position, or near it.", "kind": "Essay"}, {"id": "close-enough", "title": "CLOSE ENOUGH TO BE WRONG", "text": "Things that went wrong when a sentence crossed a border.\n\n\"79% of Israeli Jews don't care about dead children in Gaza.\" That is what Shaul Magid told Haaretz in August 2025. The Israel Democracy Institute's July 2025 survey actually asked whether respondents were personally troubled by reports of hunger and suffering among the Palestinian population in Gaza. Not \"care.\" Not \"children.\" Not \"dead.\" The 79% is a collapsed two-point band (almost not troubled + not at all troubled) whose internal breakdown the IDI did not publish on its summary page. Three distortions in one citation, each small enough to miss, each changing what the number means. The survey is real. The finding is real. What Magid said about it is not what it said about itself.\n\nFour models read a poem. In 2012 I published a Hebrew poem in Haaretz. It is set at Ben-Gurion Airport — the statesman, not the destination. A drunk Russian literary ghost (Venedikt Yerofeyev, author of Moscow-Petushki) delivers a monologue at the departure gate. Four AI models were asked to translate it. Each one missed the Yerofeyev intertext. Each produced a different wrong poem. The errors were not random — each model resolved the ambiguity by choosing the most conventional reading available, which in every case meant flattening the joke. The poem survived translation only after the misreadings were identified and removed.\n\nTen translations of one letter. In February 2025, Rav Dov Landau published a letter declaring Zionism to be כפירה ומרידה במלכות שמים — heresy and rebellion against the Kingdom of Heaven. Ten English-language outlets translated the letter. Ten different renderings of שמד: apostasy, forced conversion, spiritual destruction, cultural erasure. Each translation is a theological argument pretending to be a word choice. None is wrong. None is the same as any other.\n\n52 errors in seven articles. A corpus of Ynet news articles, audited for Hebrew-language errors: agreement violations, proscribed connectors, English calques, construct-chain problems. Opinion and long-form analysis carried the most errors. Short quote-driven news carried the fewest. The pattern is consistent enough to be structural: the further a text travels from its source, the more it degrades.\n\nThis page collects exhibits. The thesis is one sentence: meaning degrades when it crosses a border. The border can be a language, a survey methodology, a neural network, a newsroom style guide, or a theological tradition. The degradation is the evidence.", "kind": "Exhibit"}, {"id": "iran", "title": "IRAN, ×22", "text": "Patrick Cockburn, The Jihadis Return: ISIS and the New Sunni Uprising (2014). A book about ISIS. Word search: \"Iran\" appears twenty-two times. \"Israel\" appears once.\n\nThe count is the argument. A book about the Islamic State in Iraq and Syria mentions Iran on nearly every other page and Israel on one page. This is not a gap in Cockburn's knowledge. It is an accurate reflection of the regional dynamics that produced ISIS, in which Iranian influence, Saudi funding, and the collapse of the Iraqi state were the operative forces and Israel was peripheral. The count registers what the book's own analysis knows but its Western readers may not expect: that the Middle East has a structure, and Israel is not always at its center.\n\nThis is the first entry in a series. Each one takes a text, counts a word, and lets the number do the arguing.\n\nSelf-determination, ×19. Shaul Magid, The Necessity of Exile. Nineteen occurrences in the body text. Fourteen in Chapter One alone. The word enters the book as a right, shifts to a claim, migrates to an assumption, and by its final appearance functions as the thing being contested. The semantic drift is visible only in the count.\n\nAntisemitism, ×37 / Palestinian, ×36. Ethan Katz, \"When Is Anti-Zionism Antisemitic?\" Two words in near-lockstep across 6,272 body words. One names the threat. The other names the people whose political claims are being sorted by the threat. The ratio is the essay's unconscious admission that it cannot discuss one without summoning the other.", "kind": "Concordance"}, {"id": "exercise", "title": "EXERCISE 8 — TRANSLATE טשטוש", "text": "A vocabulary quiz you cannot pass.\n\nIn his poem \"Exercises in Practical Hebrew,\" Dan Pagis wrote a language-textbook exercise that turns into the Holocaust mid-lesson. The form of the exercise is the joke and the horror at once: the orderly pedagogical structure cannot contain what it is being asked to teach.\n\nThis page borrows the form. Below is a real exercise. It uses a real word from a real political speech. There is no correct answer.\n\nTranslate: טשטוש (tishṭush).\n\nThe word appears in Israeli security and political discourse to describe the blurring of boundaries — between civilian and military authority, between institutional roles, between truth and its management. It derives from the root ט.ש.ט.ש, which in construction Hebrew means to plaster or skim-coat a wall.\n\nChoose the best English rendering:\n\n(a) Blurring — accurate to the visual metaphor; loses the physical register entirely. (b) Whitewashing — captures the cover-up connotation; imports a racial metaphor absent from the Hebrew. (c) Papering over — preserves the construction-trade register; loses the spatial and visual sense. (d) Obfuscation — semantically precise; sounds like a legal filing, not a political speech.\n\nEach answer is defensible. Each loses something the Hebrew carries without effort. The exercise teaches what translation always teaches: that no rendering is wrong, and none is the same as the original, and the gap between them is where the meaning lives.\n\nMore exercises, built from the same method: מרות (authority / subordination / the texture of being ruled), מזב\"ש (a military acronym for damage control that has become a civilian verb), שליח ציבור (the prayer leader who is also, literally, a public emissary — which is the religious sense and which is the political one?).", "kind": "Exercise"}]}</script>
<script>
(function(){
'use strict';
const pages=JSON.parse(document.getElementById('app-data').textContent).pages;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEB=/[֐-׿](?:[֐-׿׳״]|[\s."](?=[֐-׿]))*/g;
function rich(s){let out='',last=0;for(const m of s.matchAll(HEB)){out+=esc(s.slice(last,m.index))+'<bdi class="he" lang="he">'+esc(m[0])+'</bdi>';last=m.index+m[0].length}return out+esc(s.slice(last))}
const titleOf=p=>p.id==='home'?'state-less':rich(p.title);
const paras=p=>{let t=p.text;if(p.id==='home')t=t.replace(/^state-less\n\n/,'');return t.split(/\n\n+/)};
const splitFirst=s=>{const m=s.match(/^(.+?[.!?]["”’']?)\s+([\s\S]+)$/);return m?[m[1],m[2]]:[s,'']};
const splitColon=s=>{const m=s.match(/^([^:]{1,40}:)\s+([\s\S]+)$/);return m?[m[1],m[2]]:[s,'']};
const deck=s=>{if(s.length<=170)return s;return s.slice(0,170).replace(/\s+\S*$/,'')+'…'};
const P=(s,cls)=>'<p'+(cls?' class="'+cls+'"':'')+'>'+rich(s)+'</p>';
const box=(h,b)=>'<div class="box">'+(h?'<h3>'+rich(h)+'</h3>':'')+(b?'<p>'+rich(b)+'</p>':'')+'</div>';
const boxFirst=s=>{const [h,b]=splitFirst(s);return box(h,b)};
const boxColon=s=>{const [h,b]=splitColon(s);return box(h,b)};
const boxName=s=>{const m=s.match(/^([^,]+,)\s([\s\S]+)$/);return '<div class="box"><p>'+(m?'<strong>'+rich(m[1])+'</strong> '+rich(m[2]):rich(s))+'</p></div>'};
const boxPerson=s=>{const m=s.match(/^(\S+\s\S+)([\s\S]+)$/);return '<div class="box"><p>'+(m?'<strong>'+rich(m[1])+'</strong>'+rich(m[2]):rich(s))+'</p></div>'};
function options(s){
  const parts=s.split(/\s(?=\([a-d]\)\s)/);
  return '<div class="options" role="group" aria-label="Renderings">'+parts.map(x=>{
    const m=x.match(/^\(([a-d])\)\s+(.+?)\s—\s([\s\S]+)$/);
    if(!m)return '<div class="box"><p>'+rich(x)+'</p></div>';
    return '<button type="button" class="option" aria-pressed="false"><span class="l">'+m[1]+'</span><span><span class="w">'+rich(m[2])+'</span><span class="c">'+rich(m[3])+'</span></span></button>'
  }).join('')+'</div>';
}
const LAYOUT={
  'home':ps=>'<div class="boxes names">'+ps.slice(0,4).map(boxPerson).join('')+'</div>'+P(ps[4],'motto')+P(ps[5],'byline'),
  'ein-medina':ps=>P(ps[0],'lede')+P(ps[1],'pull')+'<div class="boxes">'+ps.slice(2,5).map(boxFirst).join('')+'</div>'+ps.slice(5).map(s=>P(s)).join(''),
  'reading':ps=>P(ps[0],'lede')+P(ps[1])+'<div class="boxes">'+ps.slice(2).map(boxName).join('')+'</div>',
  'nation-undoing':ps=>P(ps[0],'lede')+'<div class="boxes">'+ps.slice(1,4).map(boxColon).join('')+'</div>'+ps.slice(4).map(s=>P(s)).join(''),
  'too-late':ps=>P(ps[0],'lede')+P(ps[1],'pull')+ps.slice(2).map(s=>P(s)).join(''),
  'close-enough':ps=>P(ps[0],'lede')+'<div class="boxes">'+ps.slice(1,5).map(boxFirst).join('')+'</div>'+ps.slice(5).map(s=>P(s)).join(''),
  'iran':ps=>'<div class="boxes">'+boxFirst(ps[0])+'</div>'+P(ps[1])+P(ps[2])+'<div class="boxes">'+ps.slice(3).map(boxFirst).join('')+'</div>',
  'exercise':ps=>P(ps[0],'lede')+P(ps[1])+P(ps[2])+P(ps[3],'pull')+P(ps[4])+P(ps[5])+options(ps[6])+ps.slice(7).map(s=>P(s)).join('')
};
function body(p){const ps=paras(p);if(LAYOUT[p.id])return LAYOUT[p.id](ps);return ps.map((s,i)=>P(s,i===0?'lede':'')).join('')}

const NAMES=['Leibowitz','Arendt','Scholem','Magid','Katz','Landau','Kenan','Tammuz','Funkenstein','Biale','Lustick','Rose','Morris','Pagis','Cassandra','Buber','Kohn','Segev','Ohana','Shapira','Pappé','Shagar','Cockburn','Yerofeyev',"Ahad Ha'am"];
const NAME_PAGES={};
NAMES.forEach(n=>{const re=new RegExp('(^|[^\\w])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\w])');const hits=pages.filter(p=>re.test(p.text)).map(p=>p.id);if(hits.length>1)NAME_PAGES[n]=hits});
function also(p){
  const rows=pages.filter(q=>q.id!==p.id).map(q=>({q,names:Object.keys(NAME_PAGES).filter(n=>NAME_PAGES[n].includes(p.id)&&NAME_PAGES[n].includes(q.id))})).filter(r=>r.names.length);
  if(!rows.length)return '';
  return '<section class="also"><h2>Also on this site</h2><ul>'+rows.map(r=>'<li><a href="#'+r.q.id+'">'+esc(r.q.title)+'</a> <span>'+esc(r.names.join(', '))+'</span></li>').join('')+'</ul></section>';
}
function pager(i){return '<nav class="pager" aria-label="Adjacent pages">'+(i>0?'<a href="#'+pages[i-1].id+'">← '+esc(pages[i-1].title)+'</a>':'')+'<a href="#index">All pages</a>'+(i<pages.length-1?'<a href="#'+pages[i+1].id+'">'+esc(pages[i+1].title)+' →</a>':'')+'</nav>'}
function head(kicker,title,full){return '<header class="page-head"><div class="kicker">'+kicker+'</div>'+(full?'<h2 class="title">':'<h1 class="title">')+title+(full?'</h2>':'</h1>')+'</header>'}
const byline=()=>{const h=pages.find(p=>p.id==='home');const ps=h?paras(h):[];return ps.length?ps[ps.length-1]:''};
function foot(){return '<footer class="foot">'+rich(byline())+'</footer>'}

let current='home';
function pageView(p,full){
  const i=pages.indexOf(p);
  return head(String(i+1).padStart(2,'0')+' · '+esc(p.kind),titleOf(p),full)+'<div class="prose">'+body(p)+'</div>'+(full?'':also(p)+pager(i));
}
function indexView(){
  return head('state-less','Pages')+'<div class="cards">'+pages.map((p,i)=>'<a class="card" href="#'+p.id+'"><div class="kicker">'+String(i+1).padStart(2,'0')+' · '+esc(p.kind)+'</div><h2>'+titleOf(p)+'</h2><p class="deck">'+rich(deck(paras(p)[0]))+'</p></a>').join('')+'</div>';
}
function allView(){return head('state-less','Read everything')+pages.map(p=>'<article class="all-page">'+pageView(p,true)+'</article>').join('')}
function highlight(s,q){const low=s.toLocaleLowerCase(),term=q.toLocaleLowerCase();let pos=0,out='',i;while((i=low.indexOf(term,pos))!==-1){out+=esc(s.slice(pos,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>';pos=i+q.length}return out+esc(s.slice(pos))}
function searchView(q){
  const ql=q.toLocaleLowerCase();
  const hits=pages.filter(p=>(p.title+' '+p.text).toLocaleLowerCase().includes(ql));
  let html=head('Search','Find a passage');
  html+=hits.map(p=>{const i=p.text.toLocaleLowerCase().indexOf(ql);const start=Math.max(0,i-90);const snip=p.text.slice(start,start+320);
    return '<section class="result"><div class="kind">'+esc(p.kind)+'</div><h2><a href="#'+p.id+'">'+highlight(p.title,q)+'</a></h2><p>'+(start?'…':'')+highlight(snip,q)+'…</p></section>'}).join('');
  if(!hits.length)html+='<div class="empty">No match. Try a shorter word or the Hebrew term itself.</div>';
  $('content').innerHTML=html+foot();
}
function bindOptions(){document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-pressed','false'));if(!on)b.setAttribute('aria-pressed','true')}))}
function render(){
  $('search').value='';
  const p=pages.find(x=>x.id===current);
  document.querySelectorAll('.nav-link').forEach(a=>{if(a.dataset.page===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('content').innerHTML=(p?pageView(p,false):current==='all'?allView():indexView())+(current==='home'?'':foot());
  if(p&&p.id==='exercise')bindOptions();
  document.title=(p?(p.id==='home'?'state-less':p.title+' · state-less'):current==='all'?'Read everything · state-less':'Pages · state-less');
}
function route(){let id=decodeURIComponent(location.hash.slice(1)||'home');if(!pages.some(p=>p.id===id)&&id!=='index'&&id!=='all')id='index';current=id;$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'auto'})}

$('page-nav').innerHTML=pages.map((p,i)=>'<a class="nav-link" data-page="'+p.id+'" href="#'+p.id+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t">'+(p.id==='home'?'state-less':esc(p.title))+'</span></a>').join('');
$('search').addEventListener('input',()=>{const q=$('search').value.trim();if(!q){render();$('search').focus();return}searchView(q)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('search').focus()}});
$('menu').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))});

const root=document.documentElement;
let saved=null;try{saved=localStorage.getItem('state-less-theme')}catch(e){}
if(saved==='dark'||saved==='light')root.dataset.theme=saved;
const effective=()=>root.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function themeLabel(){const e=effective();$('theme').textContent=e==='dark'?'Light':'Dark';$('theme').setAttribute('aria-label','Switch to '+(e==='dark'?'light':'dark')+' theme')}
themeLabel();
$('theme').addEventListener('click',()=>{root.dataset.theme=effective()==='dark'?'light':'dark';try{localStorage.setItem('state-less-theme',root.dataset.theme)}catch(e){}themeLabel()});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeLabel);
$('print').addEventListener('click',()=>window.print());
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
